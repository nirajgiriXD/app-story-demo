<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasky</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Tasky</h1>
        <p class="tagline">A small task list for your day.</p>
      </header>

      <form id="new-task" autocomplete="off">
        <label for="task-title" class="visually-hidden">New task</label>
        <input id="task-title" name="title" type="text" placeholder="What needs doing?" maxlength="120" required />
        <button type="submit">Add task</button>
      </form>

      <nav class="filters" aria-label="Show tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </nav>

      <ul id="task-list" aria-live="polite"></ul>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>

      <footer>
        <span id="count">0 tasks left</span>
        <button type="button" id="clear-done">Clear done</button>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
